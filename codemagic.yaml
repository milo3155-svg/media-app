workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Clean and regenerate Android platform
        script: |
          rm -rf android
          flutter create . --platforms=android
      - name: Build APK
        script: |
          flutter build apk --release --no-pub
    artifacts:
      - build/**/outputs/**/*.apk
