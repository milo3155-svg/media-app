name: Compilador Apex (Android)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Extraer código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          architecture: x64

      - name: Clean and Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Ajustar margen del icono y generar iconos
        run: |
          command -v convert >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y imagemagick)
          convert assets/ojo_pirata.png -resize 660x660 -background black -gravity center -extent 1024x1024 assets/ojo_pirata.png
          dart run flutter_launcher_icons

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Subir el APK listo
        uses: actions/upload-artifact@v4
        with:
          name: Apex-VIP-App
          path: build/app/outputs/flutter-apk/app-release.apk
