name: media_app
description: Aplicación multimedia multiplataforma
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Motor de Audio y Segundo Plano
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  
  # Estado global y Arquitectura
  provider: ^6.1.2
  
  # Almacenamiento Local (Bóveda y Favoritos)
  shared_preferences: ^2.2.3
  
  # Gestor de Descargas y Rutas
  dio: ^5.4.3
  path_provider: ^2.1.3
  
  # Red y APIs (Búsqueda y Deportes)
  http: ^1.2.0
  
  # UI Nativa (Compartir)
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
