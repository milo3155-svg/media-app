name: media_app
description: "Aplicación multimedia con reproducción en segundo plano y feed deportivo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Reproductor de audio y video
  just_audio: ^0.9.36
  video_player: ^2.8.2
  chewie: ^1.7.5
  
  # Backend de YouTube y Red
  youtube_explode_dart: ^2.2.1
  http: ^1.2.0
  
  # Base de datos local y utilidades
  shared_preferences: ^2.2.2
  share_plus: 7.2.2
  provider: ^6.1.1

dependency_overrides:
  package_info_plus: 8.0.2
  wakelock_plus: 1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
