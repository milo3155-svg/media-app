name: media_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (Conexión con Mesa de Control)
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

  # Dependencias clave congeladas para el reproductor VIP y audio en segundo plano
  just_audio: 0.9.44
  just_audio_background: 0.0.1-beta.15
  audio_session: 0.1.25
  audio_service: 0.18.17
  youtube_explode_dart: 3.0.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ojo_pirata.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/ojo_pirata.png"

flutter:
  uses-material-design: true
  assets:
    - assets/ojo_pirata.png
