name: media_app
description: "Aplicación multimedia con reproducción nativa sin bloqueos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Motor WebView Nativo Infalible
  webview_flutter: ^4.7.0
  youtube_explode_dart: ^2.3.4
  http: ^1.2.0
  
  # Estado y utilidades
  provider: ^6.1.1
  share_plus: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
