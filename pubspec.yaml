name: media_app
description: "Aplicación multimedia estilo YMusic con segundo plano y feed deportivo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Reproductores de Audio Estilo YMusic
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  youtube_explode_dart: ^2.2.1
  http: ^1.2.0
  
  # Base de datos local y estado
  provider: ^6.1.1
  share_plus: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
