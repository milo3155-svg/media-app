name: media_app
description: "Aplicación multimedia con sesión de audio nativa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # LIBRERÍAS DE AUDIO Y SESIÓN
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  youtube_explode_dart: ^2.3.4
  http: ^1.2.0
  
  # ESTADO Y UTILIDADES
  provider: ^6.1.1
  share_plus: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
